<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Details | Local Media Shelf</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="page-shell">
      <a class="back-link" href="/">&larr; Back to library</a>

      <p id="details-status" class="status-message" role="status">
        Loading media details...
      </p>

      <article id="media-details" class="media-details" hidden>
        <h1 id="media-title"></h1>
        <p class="media-details__summary">
          <span id="media-type"></span>
          &middot;
          <span id="media-genre"></span>
        </p>

        <section class="tmdb-section" aria-labelledby="tmdb-heading">
          <h2 id="tmdb-heading">TMDB Metadata</h2>
          <p id="tmdb-status" class="status-message" role="status">
            Loading TMDB metadata...
          </p>

          <div id="tmdb-content" class="tmdb-content" hidden>
            <img id="tmdb-poster" alt="" hidden>

            <div>
              <h3 id="tmdb-title"></h3>
              <p id="tmdb-overview" class="tmdb-overview"></p>

              <dl class="tmdb-facts">
                <div>
                  <dt>Release date</dt>
                  <dd id="tmdb-release-date"></dd>
                </div>
                <div>
                  <dt>Rating</dt>
                  <dd id="tmdb-rating"></dd>
                </div>
              </dl>
            </div>
          </div>
        </section>

        <dl class="media-facts">
          <div>
            <dt>Watched</dt>
            <dd id="watched-status"></dd>
          </div>
          <div>
            <dt>Favorite</dt>
            <dd id="favorite-status"></dd>
          </div>
        </dl>

        <div class="media-actions">
          <button id="watched-button" type="button">
            Update watched status
          </button>
          <button id="favorite-button" type="button">
            Update favorite status
          </button>
        </div>

        <p
          id="action-status"
          class="status-message media-action-status"
          role="status"
        ></p>
      </article>
    </main>

    <script src="/js/details.js"></script>
  </body>
</html>
