<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Media Shelf</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>Local Media Shelf</h1>
        <p>A small collection of movies and shows.</p>
      </header>

      <section aria-labelledby="library-heading">
        <h2 id="library-heading">Your Library</h2>

        <div class="library-controls">
          <label for="search-input">Search by title</label>
          <input
            id="search-input"
            type="search"
            placeholder="Enter a movie or show title"
            autocomplete="off"
          >
        </div>

        <p id="app-status" class="status-message" role="status">
          Loading your media...
        </p>
        <div id="media-grid" class="media-grid"></div>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
