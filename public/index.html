<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Media Shelf</title>
    <link rel="stylesheet" href="/css/style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <h1>Local Media Shelf</h1>
        <p>A small collection of movies and shows.</p>
      </header>

      <section class="scan-section" aria-labelledby="scan-heading">
        <h2 id="scan-heading">Scan a Media Folder</h2>
        <p class="scan-description">
          Preview supported media before adding anything to the library.
        </p>

        <form id="scan-form">
          <label for="scan-path">Absolute folder path</label>
          <div class="scan-controls">
            <input
              id="scan-path"
              type="text"
              placeholder="E:\Media\Backup"
              autocomplete="off"
              required
            >
            <button id="scan-button" type="submit">Scan folder</button>
          </div>
        </form>

        <p id="scan-status" class="status-message" role="status"></p>

        <div id="scan-preview" class="scan-preview" hidden>
          <h3>Scan Preview</h3>
          <ul id="scan-results"></ul>
          <div class="scan-preview-actions">
            <button id="import-button" type="button">
              Import all candidates
            </button>
          </div>
        </div>
      </section>

      <section aria-labelledby="library-heading">
        <div class="library-header">
          <h2 id="library-heading">Your Library</h2>
          <button
            id="delete-all-button"
            class="danger-button"
            type="button"
            disabled
          >
            Delete all media
          </button>
        </div>

        <div class="library-controls">
          <label for="search-input">Search by title</label>
          <input
            id="search-input"
            type="search"
            placeholder="Enter a movie or show title"
            autocomplete="off"
          >
        </div>

        <p id="app-status" class="status-message" role="status">
          Loading your media...
        </p>
        <div id="media-grid" class="media-grid"></div>
      </section>
    </main>

    <script src="/js/app.js"></script>
  </body>
</html>
